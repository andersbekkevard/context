<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="generator" content="pandoc">
$for(author-meta)$
  <meta name="author" content="$author-meta$">
$endfor$
  <title>$pagetitle$</title>
  <link rel="stylesheet" href="exam.css">
  <script>
    // Apply saved theme before first paint to avoid a light-mode flash.
    (function () {
      try {
        var t = localStorage.getItem("exam-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
$if(math)$
  $math$
$endif$
$for(header-includes)$
  $header-includes$
$endfor$
</head>
<body>
<button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark / light mode">
  <span class="icon-moon" aria-hidden="true">☾</span>
  <span class="icon-sun" aria-hidden="true">☀</span>
</button>
<script>
  (function () {
    var btn = document.querySelector(".theme-toggle");
    if (!btn) return;
    function currentTheme() {
      var explicit = document.documentElement.getAttribute("data-theme");
      if (explicit) return explicit;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light";
    }
    btn.addEventListener("click", function () {
      var next = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("exam-theme", next); } catch (e) {}
    });
  })();
</script>
$if(banner)$
<div class="exam-banner">$banner$</div>
$endif$
$if(title)$
<header>
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle">$subtitle$</p>
$endif$
$for(author)$
  <p class="author">$author$</p>
$endfor$
$if(date)$
  <p class="date">$date$</p>
$endif$
</header>
$endif$
$body$
</body>
</html>
